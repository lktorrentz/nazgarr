name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Chiamata anche da docker-publish.yml, che pubblica solo se passa.
  workflow_call: {}

# Solo lettura: la CI non pubblica niente.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # Un job appeso fallisce dopo 30 minuti invece di bloccare le pubblicazioni per ore.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt && pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    # Un job appeso fallisce dopo 30 minuti invece di bloccare le pubblicazioni per ore.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Senza script di installazione dei pacchetti, come nel Dockerfile.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Test (vitest)
        working-directory: frontend
        run: npm run test

      - name: Build (type-check + vite build)
        working-directory: frontend
        run: npm run build

      # I tipi del frontend (src/api/schema.ts) vengono dallo schema OpenAPI
      # del backend: si rigenerano qui, senza un backend in esecuzione, e
      # devono essere quelli nel repository (audit 2026-10-18: prima lo si
      # scopriva solo ricordandosi di lanciare gen-types). Dopo la build:
      # con frontend/dist lo schema ha anche la route della SPA, come quando
      # li si rigenera a mano.
      - name: Set up Python (OpenAPI types)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies (OpenAPI types)
        run: pip install --require-hashes -r requirements.txt

      - name: OpenAPI types up to date (schema.ts)
        run: |
          python -c "import json; from nazgarr.main import app; json.dump(app.openapi(), open('/tmp/openapi.json', 'w'))"
          (cd frontend && npx openapi-typescript /tmp/openapi.json -o src/api/schema.ts)
          git diff --exit-code -- frontend/src/api/schema.ts \
            || { echo "::error::frontend/src/api/schema.ts is stale: regenerate it (npm run gen-types)"; exit 1; }
