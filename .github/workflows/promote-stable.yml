name: Promote to stable

# Canale stable, per chi prova l'app senza ricevere ogni build di test:
# una versione già pubblicata da docker-publish.yml (immagine :X.Y.Z e
# GitHub Release vX.Y.Z, prerelease) diventa quella stable.
# - immagini :stable e :latest = stessa lista di manifest di :X.Y.Z (nessuna
#   nuova build): chi usa :latest resta sul canale stable, le build di test
#   sono su :nightly;
# - GitHub Release vX.Y.Z non più prerelease, segnata come Latest (è ciò
#   che il controllo aggiornamenti dell'app confronta sul canale stable);
# - tag git "stable" spostato sul commit di vX.Y.Z.
# Il tag "stable" non corrisponde a v*.*.*: non fa ripartire docker-publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (e.g. 0.3.0). Empty = the latest published version."
        required: false
        default: ""

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT#v}"
          if [[ -z "$version" ]]; then
            version=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
          fi
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version not found: publish it first (push to main)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Promoting v$version to stable"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Tag the image as stable and latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME,,}"
          source="$image:$VERSION"
          docker buildx imagetools create -t "$image:latest" -t "$image:stable" "$source"
          docker buildx imagetools inspect "$image:stable"

      - name: Mark the release as stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --prerelease=false --latest
          git tag -f stable "v$VERSION^{commit}"
          git push -f origin stable
