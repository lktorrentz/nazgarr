name: Build and publish Docker image

# A ogni push su main: versione = patch successiva all'ultimo tag vX.Y.Z
# (o BASE_VERSION di app/version.py se più alta, per i salti di minor),
# immagine pubblicata come :nightly, :X.Y.Z e :sha-xxxxxxx, poi tag git e
# GitHub Release con le note generate dai commit, come PRERELEASE: sono
# build di test (canale :nightly). :stable e :latest (sempre uguali) si
# aggiornano solo a mano, con .github/workflows/promote-stable.yml. Nessun commit automatico
# sul repo. Un tag vX.Y.Z spinto a mano pubblica esattamente quella
# versione. I tag creati qui col GITHUB_TOKEN non fanno ripartire il
# workflow (comportamento di GitHub Actions), quindi niente doppie build.
# Lanciato a mano (workflow_dispatch) su un branch diverso da main:
# immagine :nightly e :sha-xxxxxxx con versione X.Y.Z-dev.<sha>, senza tag
# git né release, per provare un branch prima del merge. Il push successivo
# su main riporta :nightly su main.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# Le due architetture si costruiscono in parallelo, ognuna nativa sulla sua
# macchina (arm64 su ubuntu-24.04-arm, non più emulato con QEMU: una
# ricostruzione completa costava ~8 minuti) e con la sua cache, pubblicate
# solo per digest; l'ultimo job le unisce in un'unica lista di manifest con i
# tag, poi tag git e release. Schema della documentazione di Docker
# ("Distribute build across multiple runners").
#
# Due push ravvicinati non devono calcolare la stessa versione.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # servono i tag per calcolare la versione

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=false
          elif [[ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
            IFS=. read -r major minor patch <<< "${latest:-0.0.0}"
            version="$major.$minor.$((patch + 1))-dev.${GITHUB_SHA::7}"
            release=false
          else
            base=$(sed -n 's/^BASE_VERSION = "\([0-9]*\.[0-9]*\.[0-9]*\)"/\1/p' app/version.py)
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
            if [[ -z "$latest" ]]; then
              IFS=. read -r major minor patch <<< "$base"
              version="$major.$minor.$((patch + 1))"
            elif [[ "$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -n1)" == "$base" && "$base" != "$latest" ]]; then
              version="$base"
            else
              IFS=. read -r major minor patch <<< "$latest"
              version="$major.$minor.$((patch + 1))"
            fi
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Version: $version (commit ${GITHUB_SHA::7})"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Platform slug
        id: slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "slug=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Solo per digest: i tag li mette il job merge, sulla lista unita.
          # Media type Docker (non OCI): Unraid riconosce gli aggiornamenti.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false
          build-args: |
            NAZGARR_VERSION=${{ needs.version.outputs.version }}
            NAZGARR_COMMIT=${{ needs.version.outputs.commit }}
          cache-from: type=gha,scope=${{ steps.slug.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.slug.outputs.slug }}
          # Niente manifest di attestazione (piattaforma "unknown/unknown")
          # nell'indice: con quelli il controllo/force update di Unraid non
          # riconosce l'immagine nuova.
          provenance: false
          sbom: false

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digests-${{ steps.slug.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tag + release
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # il tag precedente, per le note della release

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # L'ordine in cui GHCR mostra i tag di una versione lo decide GHCR
          # (verificato: non segue quello di applicazione), non si controlla da qui.
          tags: |
            type=sha,format=short
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=nightly,enable=${{ github.ref_type == 'branch' }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.version.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

      # Solo dopo un'immagine pubblicata: un tag esiste sempre anche su GHCR.
      - name: Tag and release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          previous=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          args=(--title "v$VERSION" --generate-notes --prerelease)
          if [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "v$VERSION" "${args[@]}"
